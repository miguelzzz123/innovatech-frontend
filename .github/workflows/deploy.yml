name: Deploy Frontend to EC2

on:
  push:
    branches: [ "deploy" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo apt-get update
            sudo apt-get install -y docker.io docker-compose-v2
            
            rm -rf ~/innovatech-frontend-deploy
            git clone https://github.com/${{ github.repository }} ~/innovatech-frontend-deploy
            
            # Buscamos el archivo docker-compose.yml no importa en qué carpeta esté
            # y ejecutamos el comando ahí mismo.
            cd $(find ~/innovatech-frontend-deploy -name "docker-compose.yml" -printf '%h' -quit)
            
            sudo docker compose down || true
            sudo docker compose up -d --build
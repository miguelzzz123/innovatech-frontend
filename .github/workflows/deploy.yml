name: Deploy Frontend to EC2

on:
  push:
    branches: [ "deploy" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Instalar Docker si no existe
            sudo apt-get update
            sudo apt-get install -y docker.io docker-compose-v2
            sudo systemctl start docker
            sudo systemctl enable docker

            # 2. Limpiar despliegues anteriores para evitar conflictos
            rm -rf ~/innovatech-frontend-deploy

            # 3. Clonar el repositorio (usando el nombre del repo actual)
            git clone https://github.com/${{ github.repository }} ~/innovatech-frontend-deploy

            # 4. Entrar a la carpeta y levantar
            cd ~/innovatech-frontend-deploy
            
            # 5. Detener contenedores viejos si existen y levantar los nuevos
            sudo docker compose down || true
            sudo docker compose up -d --build